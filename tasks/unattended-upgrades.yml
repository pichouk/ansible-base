- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present

- name: Enable daily security-only upgrades, never reboot automatically
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: 0644
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      // Never reboot automatically: encrypted volumes are unlocked by hand at boot.
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Restrict unattended-upgrades to Debian security updates only
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-security-only
    owner: root
    group: root
    mode: 0644
    content: |
      // Security updates only: point-release updates stay manual.
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
